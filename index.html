var $=function(i){return document.getElementById(i)},R={},vis={0:1},cur=0,COL=['#c62828','#2e7d32','#8e44ad','#e67e22'];

for(y=0;y<=ym;y+=st)s+='<line x1="'+X(0)+'" y1="'+Y(y)+'" x2="'+X(xm)+'" y2="'+Y(y)+'" stroke="var(--bd)"/><text x="'+(m-5)+'" y="'+(Y(y)+3)+'" font-size="10" text-anchor="end">'+y+'</text>';

(o.regs||[]).forEach(function(r){var p=[[0,0],[xm,0],[xm,ym],[0,ym]];r.forEach(function(j){p=clip(p,cs[j])});if(p.length>2)s+='<polygon points="'+p.map(function(q){return X(q[0])+','+Y(q[1])}).join(' ')+'" fill="var(--acc)" opacity="'+(o.regs.length>1?.25:.4)+'"/>'});
(o.lines||cs.map(function(c,j){return j})).forEach(function(j){var c=cs[j],a,b,d,e;if(c.b){a=-60;b=(c.c-c.a*a)/c.b;d=60;e=(c.c-c.a*d)/c.b}else{a=d=c.c/c.a;b=-60;e=60}
s+='<line clip-path="url(#cp'+id+')" x1="'+X(a)+'" y1="'+Y(b)+'" x2="'+X(d)+'" y2="'+Y(e)+'" stroke="'+COL[j]+'" stroke-width="2.2"'+((c.op=='<'||c.op=='>')?' stroke-dasharray="6 4"':'')+'/>'});
(o.pts||[]).forEach(function(p){var f=p.s=='sel'?'var(--acc)':p.s=='off'?'none':(p.ok?'#2e7d32':'#c62828');s+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="'+(p.s?5:6)+'" fill="'+f+'" stroke="'+(p.s=='off'?'var(--mut)':'#fff')+'" stroke-width="1.2"/>'});
var v=$(id);v.setAttribute('viewBox','0 0 '+W+' '+H);v.innerHTML=s;

function YT(id,a,r,o1,o2){return '<select id="'+id+'" data-ans="'+a+'" data-rep="'+r+'"><option value="">?</option><option value="'+o1[0]+'">'+o1[1]+'</option><option value="'+o2[0]+'">'+o2[1]+'</option></select>'}
var YA=function(id,a,r){return YT(id,a,r,['ya','Ya'],['tidak','Tidak'])};
function msg(id,ok,tx){var e=$(id);e.className='fb '+(ok?'ok':'bad');e.textContent=tx}

msg(fb,n==ids.length,n+' dari '+ids.length+' benar'+(n==ids.length?'. Hebat!':'. Perbaiki isian yang merah lalu periksa lagi.'))}

function go(n){cur=n;vis[n]=1;for(var i=0;i<5;i++){$('s'+i).classList.toggle('on',i==n);$('tabs').children[i].setAttribute('aria-selected',i==n)}

SL=[C(1,1,'≤',12),C(1,2,'≤',16),C(1,0,'≥',0),C(0,1,'≥',0),C(2,5,'=',10)],SEL=[C(1,1,'≤',6),C(1,0,'≤',4),C(1,0,'≥',0),C(0,1,'≥',0),C(4,3,'=',12)];COL.push('#e67e22');

sx('s0',`<h2>🎯 Identitas dan Petunjuk</h2>
<p class="open">Setiap usaha punya batas: bahan, waktu, uang, tempat. Agar keputusan produksi bisa dihitung, masalah cerita harus diubah menjadi <b>model matematika</b>. Hari ini kamu belajar menyusunnya dengan rapi dan benar.</p>
<div class="card"><div class="g"><input type="text" id="nk" placeholder="Nama" aria-label="Nama"><input type="text" id="kl" placeholder="Kelas / kelompok" aria-label="Kelas"><input type="text" id="ab" placeholder="No. absen" aria-label="Absen"></div></div>
<h3>Tujuan pembelajaran</h3><div class="card"><ul><li>Menyebutkan tiga unsur program linear: variabel keputusan, kendala, dan fungsi tujuan.</li><li>Menyajikan data soal cerita dalam tabel.</li><li>Menyusun kendala sebagai sistem pertidaksamaan linear, lengkap dengan kendala nonnegatif.</li><li>Menyusun fungsi tujuan dari keuntungan atau biaya per unit.</li></ul></div>
<h3>Peta kegiatan PBL</h3><div class="card"><table><tr><th>Fase</th><th>Kegiatan</th></tr><tr><td>1 Orientasi masalah</td><td>Masalah Pak Dedi dan simulasi produksi</td></tr><tr><td>2 Mengorganisasikan</td><td>Menerjemahkan kata ke tanda, tiga unsur, tabel data</td></tr><tr><td>3 Penyelidikan</td><td>Tiga latihan menyusun model: pemisalan, tabel, kendala, fungsi tujuan</td></tr><tr><td>4 Evaluasi</td><td>Dua soal pemodelan</td></tr></table></div>
<h3>Cara mengerjakan</h3><div class="card"><p>Isian dan pilihan diperiksa otomatis lewat tombol <i>Periksa</i>. Jawaban tertulis dikoreksi guru. Kerjakan berurutan dari Fase 1 sampai Fase 5. Kamu tidak perlu mencari nilai optimum, cukup menyusun modelnya.</p></div>`);
sx('s1',`<h2>Fase 1 · Orientasi pada Masalah</h2>
<p class="open">Baca masalah berikut dengan saksama, lalu catat apa yang kamu temukan.</p>
<div class="card"><p><b>Masalah Pak Dedi.</b> Pak Dedi membuat dua paket oleh-oleh. Paket A membutuhkan 2 kg bahan dan 1 jam kerja. Paket B membutuhkan 1 kg bahan dan 2 jam kerja. Persediaan bahan 10 kg dan waktu kerja 8 jam. Keuntungan paket A Rp20.000,00 dan paket B Rp30.000,00. <i>Tuliskan semua batasan dan tujuan Pak Dedi dalam bentuk matematika.</i></p></div>
<h3>Catatan bacaanku</h3><div class="card">
<p><b>1.</b> Sebutkan dua batas (kendala) yang dimiliki Pak Dedi.</p>${TA('Catatan 1 (dua kendala)','',50)}
<p><b>2.</b> Apa yang dicari Pak Dedi? Tentukan variabelnya.</p>${TA('Catatan 2 (variabel)','',50)}
<p><b>3.</b> Apa yang ingin dibuat sebesar-besarnya?</p>${TA('Catatan 3 (tujuan)','',50)}
<p><b>4.</b> Mengapa paket A dan B tidak boleh bernilai negatif?</p>${TA('Catatan 4 (nonnegatif)','',50)}</div>
<h3>Menurutmu</h3><div class="card"><p>Mengapa batas bahan ditulis dengan tanda "paling banyak" (≤), bukan "tepat sama dengan" (=)?</p>${TA('Menurutku (mengapa ≤)')}</div>
<h3>Rumusan masalah</h3><div class="card"><p><b>Masalah 1.</b> Susun model matematika masalah Pak Dedi.</p><p><b>Masalah 2.</b> Susun model matematika untuk soal produksi roti, barang, dan kue pada Fase 3, lalu dua soal pada evaluasi.</p></div>`);
sx('s2',`<h2>Fase 2 · Mengorganisasikan Belajar</h2>
<h3>Apersepsi: dari kata ke tanda</h3>
<div class="card"><p>Pilih tanda yang sesuai.</p>
<p>"Tidak lebih dari 20" → x ${SG$('a1','≤','V')} 20 · "Paling sedikit 6" → x ${SG$('a2','≥','V')} 6 · "Kurang dari 10" → x ${SG$('a3','<','V')} 10 · "Minimal 5" → x ${SG$('a4','≥','V')} 5 · "Maksimum 50" → x ${SG$('a5','≤','V')} 50</p>
<button class="btn" onclick="chk(['a1','a2','a3','a4','a5'],'apf')">Periksa</button><p class="fb" id="apf"></p></div>
<h3>Tiga unsur program linear</h3>
<div class="card"><p>Program linear adalah metode untuk menentukan nilai maksimum atau minimum <b>fungsi tujuan</b> dengan memperhatikan <b>kendala</b> berbentuk pertidaksamaan linear. Kelompokkan bagian model Pak Dedi berikut.</p>
<table><tr><th>Bagian model</th><th>Termasuk</th></tr><tr><td>x = banyak paket A, y = banyak paket B</td><td>${U('u1','var')}</td></tr><tr><td>Z = 20.000x + 30.000y</td><td>${U('u2','fungsi')}</td></tr><tr><td>2x + y ≤ 10 (batas bahan)</td><td>${U('u3','kendala')}</td></tr><tr><td>x ≥ 0 dan y ≥ 0</td><td>${U('u4','kendala')}</td></tr></table>
<button class="btn" onclick="chk(['u1','u2','u3','u4'],'uf')">Periksa</button><p class="fb" id="uf"></p>
<div class="key"><b>Langkah menyusun model:</b> (1) misalkan yang dicari sebagai x dan y, (2) susun tabel kebutuhan dan persediaan, (3) tulis tiap batasan sebagai pertidaksamaan, (4) tulis fungsi tujuan dari untung atau biaya per unit.</div></div>
<h3>Pemisalan variabel</h3><div class="card">${TA('Pemisalan variabel','Misalkan x = ... dan y = ...',50)}</div>
<h3>Tabel data masalah Pak Dedi</h3>
<div class="card"><table><tr><th></th><th>Bahan (kg)</th><th>Waktu (jam)</th><th>Untung (Rp)</th></tr><tr><td>Paket A (x)</td><td>${B('t1',2,'S')}</td><td>${B('t2',1,'S')}</td><td>${B('t3',20000,'S')}</td></tr><tr><td>Paket B (y)</td><td>${B('t4',1,'S')}</td><td>${B('t5',2,'S')}</td><td>${B('t6',30000,'S')}</td></tr><tr><td>Persediaan</td><td>${B('t7',10,'S')}</td><td>${B('t8',8,'S')}</td><td>–</td></tr></table>
<button class="btn" onclick="chk(['t1','t2','t3','t4','t5','t6','t7','t8'],'tf')">Periksa</button><p class="fb" id="tf"></p>
<div class="key"><b>Kunci membaca tabel:</b> setiap <b>baris persediaan</b> menjadi satu kendala. Kalikan kebutuhan tiap produk dengan x atau y, jumlahkan, lalu bandingkan dengan persediaan.</div></div>
<h3>Rencana kelompok</h3><div class="card"><p class="hint">Contoh peran: pencatat tabel, penyusun kendala, penyusun fungsi tujuan, pemeriksa satuan.</p>${TA('Rencana penyelesaian','Langkah apa yang akan kamu dan kelompokmu lakukan?')}</div>`);
sx('s3',`<h2>Fase 3 · Menyelidiki: Menyusun Model ★</h2>
<h3>Contoh · Pak Dedi: model lengkap (terbimbing)</h3>
<div class="card"><p>Dari tabel di Fase 2:</p>
<p>Bahan: ${B('b1',2,'V')}x + ${B('b2',1,'V')}y ${SG$('b3','≤','V')} ${B('b4',10,'V')} · Waktu: ${B('b5',1,'V')}x + ${B('b6',2,'V')}y ${SG$('b7','≤','V')} ${B('b8',8,'V')}</p>
<p>Nonnegatif: x ${SG$('b9','≥','S')} 0 dan y ${SG$('b10','≥','S')} 0 · Fungsi tujuan: Z = ${B('b11',20000,'S')}x + ${B('b12',30000,'S')}y</p>
<button class="btn" onclick="chk(['b1','b2','b3','b4','b5','b6','b7','b8','b9','b10','b11','b12'],'bf')">Periksa</button><p class="fb" id="bf"></p></div>
<h3>Soal 1. Produksi Roti</h3>
<div class="card"><p>Sebuah toko roti memproduksi dua jenis roti, yaitu roti I dan roti II. Untuk membuat satu roti I diperlukan 100 gram tepung dan 75 gram mentega, sedangkan satu roti II diperlukan 50 gram tepung dan 75 gram mentega. Setiap hari, toko tersebut memiliki persediaan tepung sebanyak 25 kg dan mentega sebanyak 30 kg. Laba yang diperoleh dari penjualan satu roti I adalah Rp3.000,00 dan satu roti II adalah Rp2.000,00.</p><p><b>Susunlah model matematika dari permasalahan tersebut!</b></p>
<p><b>Langkah 1. Pemisalan</b></p>${TA('Roti: pemisalan variabel','Misalkan x = ... dan y = ...',50)}
<p><b>Langkah 2. Tabel data</b> <span class="hint">(samakan satuan: 1 kg = 1.000 g)</span></p>
<table><tr><th></th><th>Tepung (g)</th><th>Mentega (g)</th><th>Laba (Rp)</th></tr><tr><td>Roti I</td><td>${B('rt1',100,'S')}</td><td>${B('rt2',75,'S')}</td><td>${B('rt3',3000,'S')}</td></tr><tr><td>Roti II</td><td>${B('rt4',50,'S')}</td><td>${B('rt5',75,'S')}</td><td>${B('rt6',2000,'S')}</td></tr><tr><td>Persediaan</td><td>${B('rt7',25000,'S')}</td><td>${B('rt8',30000,'S')}</td><td>–</td></tr></table>
